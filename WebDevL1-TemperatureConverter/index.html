<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert temperatures between Celsius, Fahrenheit and Kelvin.">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="converter">
    <header class="page-header">
      <p class="eyebrow">QUICK UNIT CONVERSION</p>
      <h1>Temperature Converter</h1>
      <p class="intro">Convert temperatures between Celsius, Fahrenheit and Kelvin.</p>
    </header>

    <section class="converter-card">
      <h2>Convert temperature</h2>
      <form id="converter-form" novalidate>
        <div class="field-group">
          <label for="temperature">Temperature value</label>
          <input type="number" id="temperature" name="temperature" step="any"
                 inputmode="decimal" placeholder="e.g. 25" required>
        </div>
        <div class="field-group">
          <label for="unit">Input unit</label>
          <select id="unit" name="unit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
          </select>
        </div>
        <button type="submit">Convert temperature</button>
        <p id="error-message" class="message error" role="alert" aria-live="polite"></p>
      </form>

      <section id="results" class="results" aria-live="polite" hidden>
        <h2>Conversion results</h2>
        <div class="result-row"><span>Celsius</span><strong id="celsius-result">—</strong></div>
        <div class="result-row"><span>Fahrenheit</span><strong id="fahrenheit-result">—</strong></div>
        <div class="result-row"><span>Kelvin</span><strong id="kelvin-result">—</strong></div>
      </section>
    </section>
    <footer><p>Built with HTML, CSS and JavaScript.</p></footer>
  </main>
</body>
</html>
